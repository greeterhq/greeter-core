name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: "3.3.5"
  BUNDLER_VERSION: "2.5.23"

jobs:
  # Lint gate. Runs first; the test jobs depend on it being green.
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle check
          bundle exec rubocop \
            --config .rubocop.yml \
            --format github

  functional:
    name: Functional Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true
      - run: bundle exec rspec --format progress

  # Domain latency guarantee (greeting-core capability). The benchmark lives at
  # spec/benchmarks/*_bench.rb, so it is not matched by the default *_spec.rb
  # run in the Functional Test job and must be invoked by explicit path. Runs in
  # parallel with Functional Test once linting is green.
  performance:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run latency benchmark (fails on budget breach)
        run: bundle exec rspec spec/benchmarks/ --format progress

  # Publish the gem to rubygems.org. Runs only on version tag pushes (e.g.
  # `v0.1.0`) and only after linting and both test jobs are green. Uses
  # RubyGems trusted publishing (OIDC) — no API key is stored in GitHub; a
  # short-lived credential is minted at run time. See README "Publishing to
  # RubyGems.org" for the one-time setup.
  publish:
    name: Publish to RubyGems.org
    runs-on: ubuntu-latest
    needs: [functional, performance]
    if: startsWith(github.ref, 'refs/tags/v')

    # Required for RubyGems trusted publishing to request the OIDC token.
    permissions:
      id-token: write
      contents: read

    environment: rubygems

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          gem_version="$(ruby -Ilib -e 'require "greeter/core/version"; print Greeter::Core::VERSION')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Gem version: ${gem_version} | Tag: ${tag_version}"
          if [ "${gem_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gem version ${gem_version}"
            exit 1
          fi

      - name: Publish to RubyGems (trusted publishing)
        uses: rubygems/release-gem@v1
